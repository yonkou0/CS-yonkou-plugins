name: Deploy Extension Repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and publish .cs3 files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          target: android-35
          components: |
            build-tools;35.0.0
            platform-tools
            platforms;android-35

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build all providers and generate manifest
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew makePluginsJson

      - name: Collect artifacts
        run: |
          mkdir -p deploy
          find . -path "*/build/*.cs3" -not -path "*/intermediates/*" -exec cp {} deploy/ \;
          cp build/plugins.json deploy/plugins.json
          cp repo.json deploy/repo.json
          cp icon.png deploy/icon.png
          ls -la deploy/

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./deploy
          force_orphan: true
